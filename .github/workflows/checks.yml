# Runs the desk's tests on every push to main (public repo: free minutes). A red X means the engine changed behaviour.
name: Checks

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

env:
  PYTHONWARNINGS: ignore

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest tests -q
