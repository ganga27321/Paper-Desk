# The Paper Desk: seven paper traders (papertrade/). Paper money only - nothing here can reach a broker.
# State (accounts, trades, plans, scans, PDFs) lives on the paper-data branch, so main stays clean.
#  - every run shares today's plan once it lands on paper-data (the 7 AM meeting pushes it)
#  - every 5 min in market hours (Dax on 1-minute bars every run; the other six every ~15 min) (+ 4:05 PM ET, which closes any day trade) -> intraday scan + cycle (fills are replayed bar by bar, so a late start still fills right)
#  - every 2 hours, any day -> futures + crypto cycle (they trade outside stock hours)
#  - 7:50 AM ET weekdays -> premarket scan even if the meeting didn't happen (autopilot)
#  - Saturday review pushes reviews/<week>.json -> the next run of any kind (crypto runs every 2 hours) becomes the weekly
#    run: scale changes, lessons, the C$200 bonus (none for a week in bonus_hold), weekly PDF. A push to paper-data can't
#    start a run itself: that branch holds no workflow files, and GitHub reads push workflows from the pushed branch.
#  - Sunday fallback -> bonus + PDF if the Saturday session was skipped
# Every run rebuilds the dashboard and deploys it to GitHub Pages.
name: Paper desk

on:
  schedule:
    - cron: "*/5 14-20 * * 1-5"
    - cron: "5 21 * * 1-5"
    - cron: "50 12 * * 1-5"
    - cron: "17 */2 * * *"
    - cron: "40 15 * * 0"
  workflow_dispatch:
    inputs:
      mode: {description: "premarket | market | close | crypto | weekly", default: market}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: paper-desk
  cancel-in-progress: false

env:
  NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
  PYTHONWARNINGS: ignore

jobs:
  desk:
    if: "!contains(github.event.head_commit.message, '[desk]')"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - name: Check out the desk's state (paper-data branch)
        run: |
          git config --global user.name "paper-desk[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code origin paper-data >/dev/null; then
            git clone --quiet --branch paper-data --single-branch "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" papertrade/state
          else
            mkdir -p papertrade/state && cd papertrade/state && git init -q -b paper-data && \
            git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          fi
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements.txt
      - name: Pick the mode
        id: mode
        env:
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          INPUT_MODE: ${{ github.event.inputs.mode }}
        run: |
          M="$INPUT_MODE"
          case "$EVENT:$SCHEDULE" in
            schedule:"50 12 * * 1-5") M=premarket ;;
            schedule:"5 21 * * 1-5") M=close ;;
            schedule:"17 */2 * * *") M=crypto ;;
            schedule:"40 15 * * 0") M=weekly ;;
            schedule:*) M=market ;;
          esac
          # a weekly review waiting on paper-data turns this run into the weekly run (reviews_applied.json lists
          # each applied review by its week)
          WK="$(date -u +%G-W%V)"
          if [ -f "papertrade/state/reviews/$WK.json" ] && ! grep -qs "$WK" papertrade/state/reviews_applied.json; then M=weekly; fi
          echo "mode=${M:-market}" >> "$GITHUB_OUTPUT"; echo "mode: ${M:-market}"
      - name: Share today's plan (every run checks; plans_shared.json sends it once, whenever the plan lands)
        if: steps.mode.outputs.mode != 'weekly'
        run: |
          P="papertrade/state/plans/$(TZ=America/Toronto date +%F).json"
          # --no-clock: the meeting validated the clock when it wrote the plan; later in the day an event it
          # rightly called "upcoming" has happened, which must not stop the plan from being shared
          if [ -f "$P" ]; then
            python -m papertrade.meeting validate "$P" --no-clock && python -m papertrade.meeting share "$P" || echo "plan not shared: see above"
          else
            echo "no plan for today"
          fi
      - name: Premarket scan (fast whole-market screen, tabled tickers first)
        if: steps.mode.outputs.mode == 'premarket'
        run: |
          D="$(TZ=America/Toronto date +%F)"
          if [ "${{ github.event_name }}" = schedule ] && [ -f papertrade/state/scans/premarket.json ] && grep -q "\"asof\": \"$(date -u +%F)" papertrade/state/scans/premarket.json; then
            echo "already scanned today"; else python -m papertrade premarket; fi
      - name: Intraday scan
        if: steps.mode.outputs.mode == 'market'
        run: python -m papertrade intraday
      - name: Cycle
        run: |
          case "${{ steps.mode.outputs.mode }}" in
            crypto) python -m papertrade cycle --only futures,crypto ;;
            market) python -m papertrade cycle --auto ;;
            *) python -m papertrade cycle ;;
          esac
      - name: Closing scoreboard (4:05 PM ET)
        if: github.event.schedule == '5 21 * * 1-5' || steps.mode.outputs.mode == 'close'
        run: python -m papertrade scoreboard
      - name: Weekly review, bonus and PDF
        if: steps.mode.outputs.mode == 'weekly'
        run: |
          F=$(python -m papertrade review | tail -1); echo "$F"
          # the phone copy is a bonus: an ntfy hiccup must not fail the run before the review is saved
          python -c "import sys; from papertrade import notify; notify.send_file(sys.argv[1], 'Paper Desk weekly summary')" "$F" || true
      - name: Save the desk's state
        run: |
          cd papertrade/state
          git add -A
          git diff --cached --quiet && exit 0
          git commit -qm "Desk ${{ steps.mode.outputs.mode }} $(date -u +%FT%TZ) [desk]"
          for i in 1 2 3 4; do
            git push -q origin HEAD:paper-data && exit 0
            git pull -q --rebase origin paper-data || true; sleep $((i * 3))
          done
          exit 1
      - name: Build the dashboard
        run: python -m papertrade site
      - uses: actions/upload-pages-artifact@v3
        with: {path: papertrade/_site}

  deploy:
    needs: desk
    runs-on: ubuntu-latest
    continue-on-error: true   # until Pages is switched on (Settings > Pages > Source: GitHub Actions)
    environment: {name: github-pages, url: "${{ steps.d.outputs.page_url }}"}
    steps:
      - id: d
        uses: actions/deploy-pages@v4
